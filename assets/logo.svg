<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Healthy Drinking Water Refilling Station logo">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056b3"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer badge ring -->
  <circle cx="300" cy="300" r="285" fill="url(#ringGrad)"/>
  <circle cx="300" cy="300" r="272" fill="#ffffff" stroke="#ffffff" stroke-width="8"/>
  <circle cx="300" cy="300" r="212" fill="url(#centerGrad)"/>
  <circle cx="300" cy="300" r="200" fill="none" stroke="#00B4A6" stroke-width="14"/>

  <!-- Text on ring (top arc) -->
  <text text-anchor="middle" font-family="'Poppins', Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="6">
    <textPath startOffset="5%" method="align" href="#ringPath">HEALTHY DRINKING WATER</textPath>
  </text>
  <!-- Text on ring (bottom arc) -->
  <text text-anchor="middle" font-family="'Poppins', Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="6">
    <textPath startOffset="5%" method="align" href="#ringPath2">REFILLING STATION</textPath>
  </text>
  <path id="ringPath" d="M 75,110 A 255,255 0 0 1 525,110" fill="none"/>
  <path id="ringPath2" d="M 525,490 A 255,255 0 0 1 75,490" fill="none"/>

  <!-- Glass -->
  <g transform="translate(240, 150)">
    <path d="M 30,0 L 30,120 Q 30,140 60,140 L 180,140 Q 210,140 210,120 L 210,0 Z" fill="#ffffff" stroke="#0066CC" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 37,15 Q 120,140 203,15" fill="none" stroke="#7FD4E8" stroke-width="14" stroke-linecap="round"/>
    <path d="M 45,45 Q 120,150 195,45" fill="none" stroke="#BFE3F2" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <!-- water in glass -->
    <path d="M 40,130 Q 120,150 200,130 L 200,0 L 40,0 Z" fill="#BFE3F2" opacity="0.55"/>
    <path d="M 50,90 Q 120,110 190,90" fill="none" stroke="#8FD8E8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Droplet accents -->
  <circle cx="300" cy="460" r="18" fill="#00B4A6" opacity="0.9"/>
  <circle cx="190" cy="520" r="14" fill="#0066CC" opacity="0.9"/>
  <circle cx="410" cy="545" r="10" fill="#00B4A6" opacity="0.8"/>
  <circle cx="370" cy="470" r="7" fill="#7FD4E8" opacity="0.9"/>
  <circle cx="240" cy="495" r="6" fill="#0066CC" opacity="0.85"/>

  <!-- Tagline arc inside bottom -->
  <text x="300" y="560" text-anchor="middle" font-family="'Poppins', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0066CC" letter-spacing="3">CLEAN · SAFE · HEALTHY</text>
</svg>
